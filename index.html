<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinity Rocks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .message {
            font-size: 24px;
            color: #667eea;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Affinity Rocks</h1>
        <div class="message" id="message">Loading...</div>
        <div class="footer">
            <p>CI/CD Demo • Powered by GitHub Actions</p>
        </div>
    </div>
    
    <script>
        fetch('message.txt')
            .then(response => response.text())
            .then(text => {
                document.getElementById('message').textContent = text.trim();
            })
            .catch(error => {
                console.error('Error loading message:', error);
                document.getElementById('message').textContent = 'Hello, Affinity!';
            });
    </script>
</body>
</html>
